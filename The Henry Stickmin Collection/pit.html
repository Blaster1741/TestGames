<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="pit.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossing the Pit</title>
  <style>
    /* Remove browser borders and force full window size */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents scrollbars */
      background-color: #000000;
    }

    /* Force the flash canvas player to stretch edge-to-edge */
    embed, ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>

  <!-- Load Ruffle locally from the extracted files in your folder -->
  <script src="ruffle.js"></script>
</head>
<body>

  <embed src="pit.swf" width="100%" height="100%">

</body>
</html>
