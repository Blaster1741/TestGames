<script>
  const TOTAL_PARTS = 26; 
  const baseFilename = 'destroy_all_humans.chd.part';

  async function loadAndAssembleGame() {
    const status = document.getElementById('status');
    const chunks = [];

    for (let i = 0; i < TOTAL_PARTS; i++) {
      const partNumber = String(i).padStart(3, '0');
      const fileUrl = `./${baseFilename}${partNumber}`;
      status.innerText = `Downloading game assets... (${i + 1}/${TOTAL_PARTS})`;

      const response = await fetch(fileUrl);
      if (!response.ok) throw new Error(`Failed to load chunk ${partNumber}`);
      const buffer = await response.arrayBuffer();
      chunks.push(buffer);
    }

    status.innerText = 'Assembling game image...';
    const fullBlob = new Blob(chunks, { type: 'application/octet-stream' });
    const blobUrl = URL.createObjectURL(fullBlob);

    status.innerText = 'Starting Emulator...';
    document.getElementById('status').style.display = 'none';
    document.getElementById('game').style.display = 'block';

    // Configure EmulatorJS with absolute CDN paths
    window.EJS_player = '#game';
    window.EJS_core = 'play';
    window.EJS_gameName = 'Destroy All Humans!';
    window.EJS_gameUrl = blobUrl;
    window.EJS_pathToData = 'https://cdn.emulatorjs.org/stable/data/';

    // Load the loader script directly from the CDN
    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(script);
  }

  loadAndAssembleGame().catch(err => {
    document.getElementById('status').innerText = 'Error loading game: ' + err.message;
  });
</script>
