<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Destroy All Humans!</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; }
    #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; text-align: center; }
    #game { width: 100vw; height: 100vh; display: none; }
  </style>
  <!-- Enables SharedArrayBuffer on GitHub Pages for multithreaded PS2 emulation -->
  <script src="https://cdn.jsdelivr.net/npm/coi-serviceworker/coi-serviceworker.min.js"></script>
</head>
<body>

  <div id="status">Loading game parts...</div>
  <div id="game"></div>

  <script>
    const TOTAL_PARTS = 26; 
    const baseFilename = 'destroy_all_humans.chd.part';

    async function loadAndAssembleGame() {
      const status = document.getElementById('status');
      const chunks = [];

      for (let i = 0; i < TOTAL_PARTS; i++) {
        const partNumber = String(i).padStart(3, '0');
        const fileUrl = `./${baseFilename}${partNumber}`;
        status.innerText = `Downloading game assets... (${i + 1}/${TOTAL_PARTS})`;

        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error(`Failed to load chunk ${partNumber}`);
        const buffer = await response.arrayBuffer();
        chunks.push(buffer);
      }

      status.innerText = 'Starting Emulator...';
      const fullBlob = new Blob(chunks, { type: 'application/octet-stream' });
      const blobUrl = URL.createObjectURL(fullBlob);

      document.getElementById('status').style.display = 'none';
      document.getElementById('game').style.display = 'block';

      // Local paths pointing directly to your repository's data/ folder
      window.EJS_player = '#game';
      window.EJS_core = 'play';
      window.EJS_gameName = 'Destroy All Humans!';
      window.EJS_gameUrl = blobUrl;
      window.EJS_pathToData = 'data/';

      // Loads loader.js from your repo
      const script = document.createElement('script');
      script.src = 'data/loader.js';
      document.body.appendChild(script);
    }

    loadAndAssembleGame().catch(err => {
      document.getElementById('status').innerText = 'Error loading game: ' + err.message;
    });
  </script>

</body>
</html>
