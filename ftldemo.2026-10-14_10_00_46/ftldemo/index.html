/* Адаптивность для игры - убираем прокрутку, но не ограничиваем размер */
html, body {
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  margin: 0;
  padding: 0;
}

/* В обычном режиме ограничиваем ширину, но делаем больше для комфортной игры */
.asm-player {
  max-width: min(100vw, 1400px);
  margin-left: auto;
  margin-right: auto;
}

/* В fullscreen режиме убираем все ограничения */
.asm-player:fullscreen,
.asm-player:-webkit-full-screen,
.asm-player:-moz-full-screen,
.asm-player:-ms-fullscreen {
  max-width: 100vw;
  max-height: 100vh;
  width: 100vw;
  height: 100vh;
  margin: 0;
}

/* Также для body в fullscreen */
body:fullscreen .asm-player,
body:-webkit-full-screen .asm-player,
body:-moz-full-screen .asm-player,
body:-ms-fullscreen .asm-player {
  max-width: 100vw;
  max-height: 100vh;
  width: 100vw;
  height: 100vh;
  margin: 0;
}
</style>

  <script type='text/javascript'>
    // Обработка fullscreen для правильного масштабирования
    function handleFullscreenChange() {
      const player = document.querySelector('.asm-player');
      if (!player) return;
      
      const isFullscreen = document.fullscreenElement || 
                          document.webkitFullscreenElement || 
                          document.mozFullScreenElement || 
                          document.msFullscreenElement;
      
      if (isFullscreen) {
        // В fullscreen убираем ограничения
        player.style.maxWidth = '100vw';
        player.style.maxHeight = '100vh';
        player.style.width = '100vw';
        player.style.height = '100vh';
        player.style.margin = '0';
      } else {
        // Выход из fullscreen - восстанавливаем ограничения
        player.style.maxWidth = 'min(100vw, 1400px)';
        player.style.maxHeight = '';
        player.style.width = '';
        player.style.height = '';
        player.style.margin = '0 auto';
        
        // Вызываем requestResize для пересчёта размеров
        if (window.asmPlayer && typeof window.asmPlayer.requestResize === 'function') {
          setTimeout(function() {
            window.asmPlayer.requestResize();
          }, 100);
        }
      }
    }
    
    // Слушаем события fullscreen
    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('mozfullscreenchange', handleFullscreenChange);
    document.addEventListener('MSFullscreenChange', handleFullscreenChange);
    
    // Также вызываем при загрузке
    window.addEventListener('load', function() {
      setTimeout(handleFullscreenChange, 500);
    });
  </script>
