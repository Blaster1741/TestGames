<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/general/style_general.css" media="all">
    <link rel="stylesheet" href="./styles/reinicio/style_reinicio.css" media="all">
    <link rel="stylesheet" href="./styles/normalize.css" media="all">
    <link rel="shortcut icon" href="./static/favicon.png" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.6.0.slim.js"></script>
    <script src="./scripts/radioChecker.js"></script>
    <title>Monopoly - Setup</title>
</head>
<body>
    <header>
        <div id="logo">the PHPoly</div>
    </header>

    <form id="setup-form">
        <div id="form">
            <div class="player-count-selector">
                <label for="numPlayers">Number of Players (2 - 8): </label>
                <select id="numPlayers" name="numPlayers">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                    <option value="5">5 Players</option>
                    <option value="6">6 Players</option>
                    <option value="7">7 Players</option>
                    <option value="8">8 Players</option>
                </select>
            </div>

            <div class="tarjetas">
                <!-- Generated dynamically by radioChecker.js -->
            </div>

            <div class="boton">
                <input type="submit" value="Start match" id="reiniciar" name="reiniciar" hidden>
            </div>
        </div>
    </form>
</body>
</html>
